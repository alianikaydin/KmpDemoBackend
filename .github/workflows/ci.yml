name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Run contract and server tests
        run: ./gradlew :contract:jvmTest :server:test :server:installDist --stacktrace
      - name: Verify contract publication for all targets
        run: ./gradlew :contract:publishToMavenLocal -PcontractVersion=0.0.0-ci --stacktrace
      - name: Build server image
        run: docker build -t kmp-demo-server:ci server/
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            server/build/reports/tests/
            contract/build/reports/tests/
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # the action lists PR commits through the API
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.28.0" # [[allowlists]] in .gitleaks.toml needs >= 8.25.0
          GITLEAKS_ENABLE_COMMENTS: "false"
